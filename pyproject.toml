[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reposentry"
version = "0.1.0"
description = "Evidence-grounded multi-agent pull request review skeleton"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.115,<1",
  "openai>=1.66,<3",
  "pydantic>=2.6,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<10",
  "ruff>=0.9,<1",
]

[project.scripts]
reposentry = "reposentry.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/reposentry"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

